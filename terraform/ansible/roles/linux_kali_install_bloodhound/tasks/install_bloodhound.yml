---
- name: install bloodhound
  become: true
  apt:
    name:  bloodhound
    state: latest
    update_cache: yes

- name: install java 11
  become: true
  apt:
    name:  openjdk-11-jdk
    state: latest
    update_cache: yes

- name: setup bloodhound
  become: true
  ansible.builtin.shell: bloodhound-setup

- name: set neo4j password
  become: true
  ansible.builtin.shell: export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 && /usr/share/neo4j/bin/neo4j-admin set-initial-password '{{ general.attack_range_password }}' && neo4j restart

- name: delete default bloodhound config
  become: true
  ansible.builtin.shell: rm /etc/bhapi/bhapi.json

- name: copy bhapi config
  copy:
    src: bhapi.json
    dest: /etc/bhapi/bhapi.json
    force: yes

- name: set bhapi password
  become: true
  ansible.builtin.shell: sed -i -e "s/BHCEPASSWORD/{{ general.attack_range_password }}/g" /etc/bhapi/bhapi.json
